<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blackbox Academy Neon Preloader</title>
  
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Google Font similar to “Dream” style -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Sacramento&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      overflow: hidden;
      font-family: "Great Vibes", cursive;
    }

    .preloader-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: white;
      z-index: 9999;
    }

    .preloader-text,
    .preloader-reflection {
      font-size: 5rem;
      letter-spacing: 2px;
      color: #ff6700;
      text-transform: capitalize;
      display: flex;
      justify-content: center;
      text-shadow:
        0 0 5px #ff6700,
        0 0 10px #ff6700,
        0 0 20px #ff6700,
        0 0 40px #ff4500,
        0 0 60px #ff4500;
    }

    .preloader-reflection {
      transform: scaleY(-1);
      opacity: 0.3;
      filter: blur(3px);
      margin-top: 8px;
    }

    .letter {
      display: inline-block;
    }

    @media (max-width: 768px) {
      .preloader-text,
      .preloader-reflection {
        font-size: 3rem;
      }
    }
  </style>
</head>
<body>
  <div class="preloader-container">
    <h1 class="preloader-text" id="mainText"></h1>
    <h1 class="preloader-reflection" id="reflectionText"></h1>
  </div>

  <script>
    const text = "Blackbox Academy";
    const mainText = document.getElementById("mainText");
    const reflectionText = document.getElementById("reflectionText");

    // Split into letters
    text.split("").forEach((char) => {
      const span = document.createElement("span");
      span.classList.add("letter");
      span.textContent = char;
      mainText.appendChild(span);

      const refSpan = span.cloneNode(true);
      reflectionText.appendChild(refSpan);
    });

    const letters = document.querySelectorAll(".letter");

    gsap.set(letters, { y: 50, opacity: 0 });
    gsap.to(letters, {
      y: 0,
      opacity: 1,
      duration: 0.8,
      ease: "elastic.out(1, 0.5)",
      stagger: 0.12,
      repeat: -1,
      repeatDelay: 1.4,
      yoyo: true,
    });

    // Optional fade-out after few seconds:
    // gsap.to(".preloader-container", {
    //   opacity: 0,
    //   duration: 1.5,
    //   delay: 4,
    //   onComplete: () => document.querySelector(".preloader-container").remove(),
    // });
  </script>
</body>
</html>
