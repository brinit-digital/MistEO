<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Widget</title>
</head>
<body>
<!-- Weather Widget Bottom Right -->
<div id="weather-widget" style="
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 250px;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(12px);
  border-radius: 15px;
  padding: 15px;
  font-family: 'Poppins', sans-serif;
  color: #000000;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  text-align: center;
  z-index: 9999;
">
  <h4 id="weather-location" style="margin:0 0 5px 0; font-size:1rem;">Detecting location...</h4>
  <div id="weather-info" style="font-size:0.95rem;">
    <p>Fetching weather...</p>
  </div>
</div>

<script>
  const apiKey = "31bd44aaa3e58468fe57fa7bde4d6472"; // 🔹 Replace with your OpenWeatherMap API key

  async function getWeather(lat, lon) {
    try {
      const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`;
      const res = await fetch(url);
      const data = await res.json();

      if (data.cod !== 200) {
        document.getElementById("weather-info").innerHTML = "<p>⚠️ Unable to fetch weather</p>";
        return;
      }

      const icon = data.weather[0].icon;
      document.getElementById("weather-location").innerText = `${data.name}, ${data.sys.country}`;
      document.getElementById("weather-info").innerHTML = `
        <img src="https://openweathermap.org/img/wn/${icon}.png" alt="Weather Icon" style="vertical-align:middle;">
        <span style="font-weight:500; font-size:1.1rem;">${data.main.temp.toFixed(1)}°C</span>
        <br>
        <small>${data.weather[0].main}</small>
      `;
    } catch (err) {
      document.getElementById("weather-info").innerHTML = "<p>⚠️ Error fetching data</p>";
    }
  }

  function fetchLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          getWeather(lat, lon);
        },
        () => {
          document.getElementById("weather-info").innerHTML = "<p>❌ Location access denied</p>";
        }
      );
    } else {
      document.getElementById("weather-info").innerHTML = "<p>⚠️ Geolocation not supported</p>";
    }
  }

  fetchLocation();
</script>


</body>
</html>
